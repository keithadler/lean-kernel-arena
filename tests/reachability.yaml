description: |
  [Reachability](https://github.com/Arrow7000/reachability): verified, kernel-reducible
  reachability and shortest walks for finite directed graphs, built on Mathlib.
  Its breadth-first search is plain structural recursion, so the examples are proved with
  `decide +kernel`, which makes the kernel evaluate the search itself. This test exports
  the whole `Reachability` module and its dependencies.
